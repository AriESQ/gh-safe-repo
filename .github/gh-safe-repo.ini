# gh-safe-repo's own repository policy, for auditing this repo:
#
#   gh-safe-repo --config .github/gh-safe-repo.ini audit AriESQ/gh-safe-repo
#
# Not at ./gh-safe-repo.ini on purpose: that path is in the config lookup
# order, so the test suite would read it and CI's trufflehog_mode = off
# config would be overridden.
#
# Only what differs from SAFE_DEFAULTS is listed. Declaring [actions] makes
# the whole section authoritative (the other keys keep their defaults).

[actions]
# Stricter than the tool default (true): only GitHub-owned actions run.
# Both workflows use only actions/* actions. If a third-party action is ever
# needed, whitelist it in patterns_allowed instead of turning this on.
verified_allowed = false
