# gh-safe-repo profile: "fork of an upstream repo you don't fully control"
#
# Use this when the target repo is a fork/clone/downstream copy of an
# upstream project, and you can't (or don't want to, yet) modify files that
# live upstream — most commonly .github/workflows/*.yml. Those workflows
# often reference actions by mutable tag (e.g. actions/checkout@v6) rather
# than a pinned commit SHA, so gh-safe-repo's default sha_pinning_required
# would block every CI run until the workflow files are fixed at the source.
#
# ALSO: gh-safe-repo's ActionsPlugin.apply() hardcodes "enabled": true into
# its PUT actions/permissions call whenever allowed_actions or
# sha_pinning_required changes (see gh_safe_repo/plugins/actions.py) — the
# [actions] enabled key below is never read anywhere, it's a no-op. On a
# fork, Actions start disabled by GitHub default, and any [actions] value
# that differs from the live current state will silently re-enable them.
# To keep Actions off, every key in [actions] below is pinned to this
# repo's actual current live value (not gh-safe-repo's hardened default),
# so fix computes zero diffs here and never touches the endpoint. Revisit
# this whole section — and switch to gh-safe-repo's real hardened defaults
# — once you deliberately decide to turn Actions on for this repo.
#
# This is a FULL config (every key from gh-safe-repo.ini.example), not a
# diff, so it can be diffed directly against gh-safe-repo.ini.example to
# catch drift when the tool adds keys or changes its defaults. Every key
# marked "# DEVIATION:" differs from the tool's safe default.

[repo]
private = true
delete_branch_on_merge = false
allow_squash_merge = true
allow_merge_commit = true
allow_rebase_merge = true
auto_init = false

[actions]
# DEVIATION: pinned to this repo's current live values (Actions disabled),
# not gh-safe-repo's hardened defaults — see header comment above.
enabled = true
allowed_actions = all
github_owned_allowed = true
verified_allowed = false
patterns_allowed =
default_workflow_permissions = write
can_approve_pull_request_reviews = true
sha_pinning_required = false
fork_pr_approval_policy = first_time_contributors

[branch_protection]
# Fallback only — the tool auto-detects the actual default branch at runtime.
protected_branch = master, main
require_pull_request = true
required_approving_reviews = 1
dismiss_stale_reviews = true
require_conversation_resolution = true
enforce_admins = false
allow_force_pushes = false
allow_deletions = false
use_rulesets = true

[tag_protection]
protected_tags = *
prevent_tag_deletion = true
prevent_tag_update = true

[security]
enable_dependabot_alerts = true
enable_dependabot_security_updates = true
enable_private_vulnerability_reporting = true
enable_secret_scanning_push_protection = true
